<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — StockGuard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">💊 StockGuard</a>
    <a class="btn secondary" href="/login.html">Log in</a>
  </nav>

  <div class="auth-card">
    <h2>Create your pharmacist account</h2>
    <form id="registerForm">
      <label>Email</label>
      <input type="email" id="email" required />
      <label>Password (min 6 characters)</label>
      <input type="password" id="password" minlength="6" required />
      <button class="btn" type="submit" style="margin-top:22px; width:100%; justify-content:center;">Create account</button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'registration failed');
        setToken(data.token);
        window.location.href = '/dashboard.html';
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
